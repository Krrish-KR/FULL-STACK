spring.application.name=post-api

# In-memory H2 database (swap for MySQL/Postgres in production)
spring.datasource.url=jdbc:h2:mem:postdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console for quick inspection during development: http://localhost:3050/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=3050

# Don't leak stack traces / internal error detail through the default
# Spring error page - GlobalExceptionHandler builds the response instead.
server.error.include-message=never
server.error.include-stacktrace=never
