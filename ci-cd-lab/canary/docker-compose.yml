# Canary stack: nginx splits traffic between stable and canary versions.
services:
  stable:
    image: ${IMAGE_STABLE:-cicd-lab:local}
    environment: { APP_VERSION: "${STABLE_VERSION:-1.0.0}" }
  canary:
    image: ${IMAGE_CANARY:-cicd-lab:local}
    environment: { APP_VERSION: "${CANARY_VERSION:-2.0.0}" }
  gateway:
    image: nginx:1.27-alpine
    ports: ["8081:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [stable, canary]
